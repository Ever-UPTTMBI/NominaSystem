<div class="view-departamentos">
    <div class="view-header">
        <div>
            <h2>🏢 Departamentos de la Empresa</h2>
            <p class="view-subtitle">Organiza las unidades operativas y áreas funcionales de la organización.</p>
        </div>
        <button id="btnNuevoDepartamento" class="btn btn-primary">➕ Nuevo Departamento</button>
    </div>

    <!-- Modal para Crear / Editar Departamento -->
    <div id="departamento-modal" class="modal-overlay" style="display:none;">
        <div class="modal-box">
            <h3 id="deptoModalTitle">Registrar Departamento</h3>
            <p class="modal-subtitle">Indica el nombre y descripción del departamento.</p>
            <form id="deptoForm">
                <input type="hidden" id="deptoId" value="">
                <div class="form-group" style="text-align: left; margin-top: 1rem;">
                    <label for="deptoNombre">Nombre del Departamento *</label>
                    <input type="text" id="deptoNombre" placeholder="Ej. Tecnología e Informática" required>
                </div>
                <div class="form-group" style="text-align: left;">
                    <label for="deptoDescripcion">Descripción</label>
                    <textarea id="deptoDescripcion" rows="3" placeholder="Funciones principales del departamento..."></textarea>
                </div>
                <div class="modal-botones" style="margin-top: 1.5rem;">
                    <button type="button" id="btnDeptoCancelar" class="modal-btn modal-btn-cancelar">Cancelar</button>
                    <button type="submit" id="btnDeptoGuardar" class="modal-btn modal-btn-confirmar">Guardar</button>
                </div>
            </form>
        </div>
    </div>

    <div class="filter-bar">
        <div class="search-input-wrapper">
            <span class="search-icon">🔍</span>
            <input type="text" id="buscadorDepto" placeholder="Buscar departamento por nombre o descripción...">
        </div>
    </div>

    <div class="table-container">
        <table>
            <thead>
                <tr>
                    <th style="width: 80px;">ID</th>
                    <th>Departamento</th>
                    <th>Descripción</th>
                    <th class="text-center" style="width: 140px;">Personal</th>
                    <th class="text-right" style="width: 160px;">Acciones</th>
                </tr>
            </thead>
            <tbody id="tablaDeptosBody">
                <tr class="fila-vacia"><td colspan="5">Cargando departamentos...</td></tr>
            </tbody>
        </table>
    </div>
</div>
