<div class="view-empleados">
    <div class="view-header">
        <div>
            <h2>👥 Gestión de Empleados</h2>
            <p class="view-subtitle">Administra el personal, salarios base y asignación de departamentos.</p>
        </div>
        <button id="btnAgregarEmpleado" class="btn btn-primary">➕ Registrar Empleado</button>
    </div>

    <div class="filter-bar">
        <div class="search-input-wrapper">
            <span class="search-icon">🔍</span>
            <input type="text" id="buscador" placeholder="Buscar por cédula, nombre o cargo...">
        </div>
        <div class="filter-select-wrapper">
            <label for="filtroDepartamento" class="filter-label">Departamento:</label>
            <select id="filtroDepartamento" class="filter-select">
                <option value="">Todos los Departamentos</option>
            </select>
        </div>
    </div>

    <div class="table-container">
        <table>
            <thead>
                <tr>
                    <th>Empleado</th>
                    <th>Cédula</th>
                    <th>Cargo</th>
                    <th>Departamento</th>
                    <th class="text-right">Sueldo Base</th>
                    <th class="text-center">H. Extras</th>
                    <th class="text-right">Acciones</th>
                </tr>
            </thead>
            <tbody id="tablaBody">
                <tr class="fila-vacia"><td colspan="7">Cargando nómina de empleados...</td></tr>
            </tbody>
        </table>
    </div>
</div>
