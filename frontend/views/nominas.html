<div class="view-nominas">
    <div class="view-header">
        <div>
            <h2>📅 Periodos de Nómina</h2>
            <p class="view-subtitle">Genera y administra los periodos quincenales/mensuales de pago para el personal.</p>
        </div>
        <button id="btnNuevaNomina" class="btn btn-primary">➕ Abrir Periodo de Nómina</button>
    </div>

    <!-- Modal para Crear / Editar Nómina -->
    <div id="nomina-modal" class="modal-overlay" style="display:none;">
        <div class="modal-box">
            <h3 id="nominaModalTitle">Nuevo Periodo de Nómina</h3>
            <p class="modal-subtitle">Configura las fechas y descripción del periodo de liquidación.</p>
            <form id="nominaForm">
                <input type="hidden" id="nominaId" value="">
                
                <div class="form-group" style="text-align: left; margin-top: 1rem;">
                    <label for="nominaPeriodo">Nombre del Periodo *</label>
                    <input type="text" id="nominaPeriodo" placeholder="Ej. 1ra Quincena Octubre 2026" required>
                </div>

                <div class="form-row-2" style="display:grid; grid-template-columns: 1fr 1fr; gap: 1rem; text-align: left;">
                    <div class="form-group">
                        <label for="nominaFechaInicio">Fecha Inicio *</label>
                        <input type="date" id="nominaFechaInicio" required>
                    </div>
                    <div class="form-group">
                        <label for="nominaFechaFin">Fecha Fin *</label>
                        <input type="date" id="nominaFechaFin" required>
                    </div>
                </div>

                <div class="form-group" style="text-align: left;">
                    <label for="nominaFechaPago">Fecha Programada de Pago *</label>
                    <input type="date" id="nominaFechaPago" required>
                </div>

                <div class="modal-botones" style="margin-top: 1.5rem;">
                    <button type="button" id="btnNominaCancelar" class="modal-btn modal-btn-cancelar">Cancelar</button>
                    <button type="submit" id="btnNominaGuardar" class="modal-btn modal-btn-confirmar">Crear Periodo</button>
                </div>
            </form>
        </div>
    </div>

    <div class="filter-bar">
        <div class="search-input-wrapper">
            <span class="search-icon">🔍</span>
            <input type="text" id="buscadorNomina" placeholder="Buscar nómina por nombre de periodo...">
        </div>
    </div>

    <div class="table-container">
        <table>
            <thead>
                <tr>
                    <th style="width: 70px;">ID</th>
                    <th>Periodo</th>
                    <th>Rango de Fechas</th>
                    <th>Fecha de Pago</th>
                    <th class="text-center" style="width: 130px;">Estado</th>
                    <th class="text-right" style="width: 280px;">Acciones Operativas</th>
                </tr>
            </thead>
            <tbody id="tablaNominasBody">
                <tr class="fila-vacia"><td colspan="6">Cargando periodos de nómina...</td></tr>
            </tbody>
        </table>
    </div>
</div>
